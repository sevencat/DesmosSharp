name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DesmosSharp.sln

      - name: Build
        run: dotnet build DesmosSharp.sln --no-restore -c Release

      - name: Test
        run: dotnet test DesmosSharp.sln --no-build -c Release
